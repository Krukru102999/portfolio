steps:
  # Step 1: Run Maven build inside a standard official Maven container to generate the target/*.jar
  - name: 'maven:3.9.6-eclipse-temurin-21'
    dir: 'app/backend'
    args: ['mvn', 'clean', 'package', '-DskipTests']

  # Step 2: Use Google's standard Java buildpack to containerize the compiled jar
  - name: 'gcr.io/k8s-skaffold/pack'
    dir: 'app/backend'
    args:
      - 'build'
      - 'us-east1-docker.pkg.dev/qwiklabs-gcp-04-4ac44ce0be20/devops-repo/devops-image:v0.1'
      - '--builder=paketobuildpacks/builder-jammy-base'
      - '--path=.'
      - '--env=BP_JVM_VERSION=21'
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    dir: 'app/backend'
    args:
      - 'run'
      - 'deploy'
      - 'devops-service'
      - '--image=us-east1-docker.pkg.dev/qwiklabs-gcp-04-4ac44ce0be20/devops-repo/devops-image:v0.1'
      - '--region=us-east1'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=1Gi'
    entrypoint: gcloud

images:
  - 'us-east1-docker.pkg.dev/qwiklabs-gcp-04-4ac44ce0be20/devops-repo/devops-image:v0.1'
options:
  logging: CLOUD_LOGGING_ONLY